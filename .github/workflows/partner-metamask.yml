# Offline unit tests for partner/metamask. No secrets, no network writes.
name: partner-metamask tests

on:
  pull_request:
    paths: ['partner/metamask/**', '.github/workflows/partner-metamask.yml']
  push:
    branches: [main]
    paths: ['partner/metamask/**', '.github/workflows/partner-metamask.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: partner/metamask
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: partner/metamask/package-lock.json
      # Foundry (pinned) for the VerdictGateEnforcer unit tests, the artifact reproducibility check,
      # and the local-anvil test in test/verdict-gate.test.mjs. No fork, no network writes.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0
      - run: npm ci
      - name: forge test (VerdictGateEnforcer)
        working-directory: partner/metamask/contracts
        run: forge test
      - name: committed artifact matches a fresh pinned build
        run: node scripts/export-enforcer-artifact.mjs --check
      - run: npm test
