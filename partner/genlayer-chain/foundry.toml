# Direct mode on GenLayer Chain (Bradbury EVM layer, chain id 4221). Local build and tests only.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.23"
evm_version = "london"
optimizer = true
optimizer_runs = 200
bytecode_hash = "ipfs"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "./" }]
